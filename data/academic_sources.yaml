schema_version: "1.0"

registry:
  name: "SLAI Academic Source Registry"
  purpose: >-
    Curated primary-source literature for knowledge integrity checks, research
    grounding, architecture review, evaluation design, and safety analysis.
  scope:
    - "foundation models and efficient adaptation"
    - "reasoning, retrieval, tool use, and autonomous agents"
    - "evaluation, trustworthiness, governance, and dataset documentation"
    - "computer vision, multimodal learning, reinforcement learning, and robotics"
  maintained_by: "SLAI project maintainers"
  last_reviewed: "2026-08-19"
  review_interval_days: 180
  review_due: "2027-02-15"
  publication_window_policy: >-
    Entries are selected to remain within the KnowledgeMonitor five-year source
    age window at the last-reviewed date. Foundational works outside that window
    should be maintained in a separately governed historical registry.
  evidence_policy:
    canonical_source_required: true
    persistent_identifier_preferred: true
    primary_source_only: true
    peer_review_not_implied: true
    abstract_is_not_full_evidence: true
    independent_replication_preferred_for_high_stakes_claims: true
  interpretation_note: >-
    Inclusion establishes provenance and relevance; it does not establish that
    every claim in a source is correct, reproduced, or suitable for deployment.

domains:
  - "arxiv.org"

