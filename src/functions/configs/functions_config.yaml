authentication:
    checkpoint_path: "data/processed/functions_auth.json"
    token_ttl_minutes:  15
    refresh_ttl_days: 14
    max_failed_attempts: 5
    lockout_minutes: 15
    inactivity_hours: 24
    require_verified: true

dropdown_animation:
    duration_ms: 220
    preset: "smooth"
    is_open: False

# Password hashing parameters (scrypt)
password_hasher:
    n: 16384   # 2**14
    r: 8
    p: 1

# TTL cache defaults
ttl_cache:
    max_size: 512
    ttl_seconds: 300

# Credential policy (optional)
credential_policy:
    min_length: 12
    require_upper: true
    require_lower: true
    require_digit: true
    require_symbol: true

portable_store:
  lock_timeout: 5.0
  ensure_ascii: false
  indent: 2
  sort_keys: true
  create_if_missing: true

language_aware:
    stopwords: null

search_engine:
    max_size: 2048
    cache_ttl_seconds: 120
    # BM25 parameters (optional)
    fuzzy_threshold: 0.8

bm25:
    k1: 1.2
    b: 0.75

rate_limiter:
    backend: "memory"
    capacity: 100
    refill_rate: 10.0
    redis_key_prefix: "slai:functions:ratelimit:"
    max_in_memory_buckets: 10000

storage:
    backend: "local"
    base_path: "data/storage"
    base_url: null
    generate_unique_filename: true
    presigned_url_ttl_seconds: 3600

email:
    backend: "smtp"
    host: "localhost"
    port: 587
    username: ""
    password: ""
    use_tls: true
    default_from: ""
    template_dir: ""
    queue_max_size: 1024
    queue_put_timeout_seconds: 1.0
    queue_reject_on_full: true
    retry_max: 3
    retry_base_delay: 0.5
    retry_max_delay: 30.0
    retry_backoff_factor: 2.0
    retry_jitter: true

phone_verification:
    backend: "console"          # "console" | "twilio"
    account_sid: ""
    auth_token: ""
    from_number: ""
    messaging_service_sid: ""
    api_base_url: null
    timeout_seconds: 10.0
    # Fallback ISO 3166-1 alpha-2 region when the caller does not
    # explicitly supply country_region.
    default_region: null
    # SLAI phone-verification OTPs are always exactly six digits.
    # Any other value is rejected during service initialization.
    code_length: 6
    code_ttl_seconds: 300
    max_verify_attempts: 5
    resend_cooldown_seconds: 60
    max_sends_per_window: 5
    send_window_seconds: 3600
    message_template: "Your verification code is: $code"
    retry_max: 3
    retry_base_delay: 0.5
    retry_max_delay: 30.0
    retry_backoff_factor: 2.0
    retry_jitter: true

webhook:
    # One configured destination per WebhookService instance.
    endpoint: ""

    # Never place the actual signing secret in this YAML file.
    # WebhookService.from_config() resolves it from this environment variable.
    secret_env: "SLAI_WEBHOOK_SECRET"

    timeout_seconds: 10.0

    # Maximum serialized request body.
    max_payload_bytes: 262144

    # Maximum webhook response body retained by SLAI.
    # 0 disables response-body retention while still retaining status/headers.
    max_response_bytes: 4096

    # Production default: HTTPS only.
    allow_http: false

    # Production default: block loopback, private, link-local,
    # reserved, multicast, and other non-global destinations.
    allow_private_hosts: false

    user_agent: "SLAI-Webhook/2.3"

    # Optional application-defined headers.
    # Security/signature headers are reserved by WebhookService.
    headers: {}

    retry_max: 3
    retry_base_delay: 0.5
    retry_max_delay: 30.0
    retry_backoff_factor: 2.0
    retry_jitter: true

    retry_status_codes:
        - 408
        - 425
        - 429
        - 500
        - 502
        - 503
        - 504