quantum_encoding:
  norm_tolerance: 1.0e-10
  normalize_inputs: true

quantum_memory:
  # Reject unknown checkpoint component fields unless a caller explicitly
  # requests a compatibility load with strict=False.
  strict_checkpoint_schema: true

quantum_mno:
  # Numerical zero guard for Born probability normalization.
  probability_tolerance: 1.0e-12
  # Exact shift for parameters used once in exp(-i * theta * P / 2).
  parameter_shift: 1.5707963267948966

quantum_policy:
  max_statevector_bytes: 16777216
  max_parameter_bytes: 16777216
  max_working_set_bytes: 268435456
  max_sequence_length: 128
  max_tasks_per_request: 32
  max_gradient_evaluations: 1000000
  max_training_steps: 1000
  # This operational allowlist may narrow, but never expand, the tunable fields
  # implemented by quantum_policy.py.
  allowed_tuning_parameters:
    - num_quantum_layers
    - learning_rate
    - entanglement
    - loss
    - gradient_method
    - finite_difference_step
    - gradient_clip_norm

vqc:
  # Supervised binary variational classifier (variational_classifier.py).
  # Inference batch size, epoch / gradient-evaluation budgets and the working-set
  # limit are inherited from quantum_policy; the parameter-shift step comes from
  # quantum_mno. Only VQC-specific limits live here.
  max_qubits: 8
  max_training_rows: 20000
  max_artifact_bytes: 1048576
  max_manifest_bytes: 65536
  # Probability clip used inside log-loss / gradient chain terms.
  probability_epsilon: 1.0e-7
  # Tolerance for unit-norm checks on states produced by the injected circuit.
  norm_tolerance: 1.0e-8
