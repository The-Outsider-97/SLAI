sensitive_attributes: ["gender", "age_group", "race", "education_level"]

issue_database:
    host: 'localhost'
    port: 5432
    database: 'ai_issues'
    user: 'user'
    password: ''

operations_notification:
    email:
        enabled: true
        from: "ai-agent@yourdomain.com"
        to: "ops@yourdomain.com"
        subject: "URGENT: AI System Hazard"
        smtp_host: "smtp.yourdomain.com"
        smtp_port: 587
        username: "ai-agent"
        password: "secure-password"
        use_tls: true

    webhook:
        enabled: true
        url: "https://hooks.slack.com/services/..."

    external_logging:
        enabled: true
        url: "https://logging-service.yourdomain.com/ingest"


benchmark_budgets:
    enabled: true
    enforce: true
    warmup_iterations: 5
    measurement_iterations: 40
    contracts:
      - name: config.cached_load
        max_p95_latency_ms: 10.0
        max_peak_memory_mb: 16.0
      - name: runtime.scope_identity
        max_p95_latency_ms: 5.0
        max_peak_memory_mb: 4.0
      - name: runtime.status_snapshot
        max_p95_latency_ms: 5.0
        max_peak_memory_mb: 4.0


autonomous_control_loop:
  enabled: true
  max_cycles: 3
  max_cycle_seconds: 45.0
  max_run_seconds: 120.0
  require_safety_approval: true
  require_explicit_execution_task: true
  stop_on_stage_error: true
  publish_events: true
  event_channel: "autonomy.events"
  latest_state_key: "autonomy:control_loop:latest"


agent_factory:
    enabled: true
    auto_register_default_agents: true
    default_version: "2.2.0"
    strict_base_agent_subclass: false
    use_instance_cache: true
    cache_agent_instances: true
    cache_imports: true
    cache_constructor_signatures: true
    construction_failure_threshold: 3
    construction_circuit_capacity: 1024
    circuit_base_cooldown_seconds: 5.0
    circuit_max_cooldown_seconds: 300.0
    allow_runtime_config_override: true
    allow_unknown_constructor_kwargs: false
    create_dependencies: true
    probe_torch_runtime: true
    block_torch_required_when_unavailable: true
    enable_out_of_process_fallback: true
    publish_observability_events: true
    record_creation_history: true
    creation_history_size: 100
    diagnostics_import_check: true
    diagnostics_constructor_check: true
    routing_max_metric_age_seconds: 30.0
    routing_require_metrics: false
    routing_require_fresh_metrics: false
    routing_allow_degraded: true
    routing_weights:
      capability: 0.25
      health: 0.20
      availability: 0.15
      latency: 0.10
      errors: 0.10
      load: 0.08
      freshness: 0.07
      preference: 0.05
    adaptation_auto_apply: false
    adaptation_proposal_history_size: 100
    discovery_enabled: false
    discovery_packages: []
    required_action_methods:
      - predict
      - get_action
      - act
      - perform_task
      - execute
    native_failure_patterns:
      - winerror 1114
      - c10.dll
      - torch_cuda.dll
      - cuda error
    aliases:
      web: browser
      obs: observability
      net: network
      collaboration: collaborative
      collaborative_agent: collaborative
      reader_agent: reader
      language_agent: language
      knowledge_agent: knowledge
      privacy_agent: privacy
      quality_agent: quality
      safety_agent: safety
      observability_agent: observability
      reasoning_agent: reasoning
      evaluation_agent: evaluation
    out_of_process_fallback_agents:
      - adaptive
      - alignment
      - evaluation
      - knowledge
      - language
      - learning
      - perception
      - planning
      - reasoning
      - safety
    dependency_profiles:
      collaborative:
        torch_required: false
        notes: "Task coordination, policy, and delegation are torch-free."
      browser:
        torch_required: false
        notes: "Selenium/browser stack only."
      planning:
        torch_required: false
        notes: "Core planning is torch-free; perception heads are optional."
      knowledge:
        torch_required: false
        notes: "SBERT/transformers are optional; TF-IDF path can run without torch."
      reasoning:
        torch_required: false
        notes: "Rule/probabilistic reasoning core does not require torch."
      language:
        torch_required: false
        notes: "Lightweight language mode available without torch."
      evaluation:
        torch_required: false
        notes: "Core evaluation works without deep anomaly torch module."
      observability:
        torch_required: false
        notes: "Observability orchestration is telemetry-first and torch-free."
      network:
        torch_required: false
        notes: "Network transport/routing/reliability stack is torch-free."
      safety:
        torch_required: false
        notes: "Safety policy checks run without torch."
      privacy:
        torch_required: false
        notes: "Privacy policy checks are rule/config driven and torch-free."
      quality:
        torch_required: false
        notes: "Document/data quality gates are dependency-light and torch-free by default."
      learning:
        torch_required: true
        notes: "RL/meta-learning pipelines require torch."
      alignment:
        torch_required: true
        notes: "Value embedding model is torch-based."
      adaptive:
        torch_required: true
        notes: "Adaptive RL workers are torch-based."
      perception:
        torch_required: true
        notes: "Perception encoder/decoder stack is torch-based."
    agent_specs:
      adaptive:
        module_path: src.agents.adaptive_agent
        class_name: AdaptiveAgent
        capabilities: [adaptation, policy_adaptation, runtime_optimization]
      alignment:
        module_path: src.agents.alignment_agent
        class_name: AlignmentAgent
        capabilities: [alignment, value_alignment, ethical_assessment]
      browser:
        module_path: src.agents.browser_agent
        class_name: BrowserAgent
        capabilities: [browser_automation, web_navigation, web_interaction]
      collaborative:
        module_path: src.agents.collaborative_agent
        class_name: CollaborativeAgent
        capabilities: [coordination, safety_assessment, shared_memory, task_delegation, collaboration_management]
        constraints:
          orchestration_scope: task_coordination
          factory_authority: false
          registry_authority: false
        metadata:
          orchestration_role: domain_orchestrator
      evaluation:
        module_path: src.agents.evaluation_agent
        class_name: EvaluationAgent
        capabilities: [evaluation, performance_assessment, anomaly_detection]
      execution:
        module_path: src.agents.execution_agent
        class_name: ExecutionAgent
        capabilities: [execution, action_selection, task_execution]
      handler:
        module_path: src.agents.handler_agent
        class_name: HandlerAgent
        capabilities: [failure_handling, recovery, escalation]
      knowledge:
        module_path: src.agents.knowledge_agent
        class_name: KnowledgeAgent
        capabilities: [knowledge_retrieval, knowledge_management, semantic_search]
      language:
        module_path: src.agents.language_agent
        class_name: LanguageAgent
        capabilities: [language_understanding, language_generation, text_processing]
      learning:
        module_path: src.agents.learning_agent
        class_name: LearningAgent
        capabilities: [learning, reinforcement_learning, model_adaptation]
      network:
        module_path: src.agents.network_agent
        class_name: NetworkAgent
        capabilities: [networking, message_routing, transport]
      observability:
        module_path: src.agents.observability_agent
        class_name: ObservabilityAgent
        capabilities: [observability, telemetry, monitoring]
      perception:
        module_path: src.agents.perception_agent
        class_name: PerceptionAgent
        capabilities: [perception, sensor_processing, representation_learning]
      planning:
        module_path: src.agents.planning_agent
        class_name: PlanningAgent
        capabilities: [planning, task_planning, scheduling]
      privacy:
        module_path: src.agents.privacy_agent
        class_name: PrivacyAgent
        capabilities: [privacy, data_protection, privacy_assessment]
      qnn:
        module_path: src.agents.qnn_agent
        class_name: QNNAgent
        capabilities: [quantum_state_simulation, quantum_circuit_inference, quantum_circuit_training, quantum_state_evaluation]
      quality:
        module_path: src.agents.quality_agent
        class_name: QualityAgent
        capabilities: [quality_assessment, validation, data_quality]
      reader:
        module_path: src.agents.reader_agent
        class_name: ReaderAgent
        capabilities: [document_reading, information_extraction, parsing]
      reasoning:
        module_path: src.agents.reasoning_agent
        class_name: ReasoningAgent
        capabilities: [reasoning, inference, decision_support]
      safety:
        module_path: src.agents.safety_agent
        class_name: SafetyAgent
        capabilities: [safety, risk_assessment, policy_enforcement]


base_agent:
    defer_initialization: true
    memory_profile: low
    network_compression: true
    max_error_log_size: 50
    error_similarity_threshold: 0.75
    max_task_retries: 0
    retry_backoff_seconds: 0.5
    retry_backoff_cap_seconds: 5.0
    task_timeout_seconds: null
    enable_known_issue_recovery: true
    enable_alternative_execute: true
    enable_shared_memory_audit: true
    execution_history_limit: 200
    metric_buffer_size_low: 100
    metric_buffer_size_medium: 500
    metric_buffer_size_high: 1000
    evaluation_log_dir: evaluation_logs
    task_similarity_str_threshold: 0.9
    jaccard_threshold: 0.5
    jaccard_min_for_no_shared: 0.7
    final_key_threshold: 0.7
    final_value_threshold: 0.7
    task_similarity_seq_elem_threshold: 0.8
    plan_resource_warning_threshold: 0.70
    plan_resource_critical_threshold: 0.90
    shared_memory_error_key_prefix: errors
    shared_memory_stats_key_prefix: agent_stats
    shared_memory_event_key_prefix: agent_events
    warm_start_key_prefix: warm_state
    retraining_flag_key_prefix: retraining_flag


adaptive_agent:
  state_dim: 10
  num_actions: 2
  num_handlers: 3
  max_episode_steps: 100

  base_learning_interval: 10
  skill_max_steps: 10
  skill_batch_size: 32
  manager_batch_size: 32
  tuning_window: 100
  performance_window: 50

  max_task_history: 200
  max_route_history: 200
  max_feedback_history: 200

  random_seed: 42

  explore_skills: true
  explore_actions: true
  learn_after_task: true
  auto_behavior_cloning: true
  auto_dagger_update: true
  auto_meta_optimize: true
  auto_save_state: true
  auto_log_interventions: true
  sync_tuner_to_skills: true
  use_global_rl_engine: true
  share_meta_registry: true

  recovery_reward_threshold: -10.0
  success_reward_threshold: 0.0
  correction_bonus: 1.0
  demonstration_bonus: 2.0
  feedback_bonus: 0.5
  route_similarity_threshold: 0.25

  shared_memory_state_ttl: 2592000
  shared_memory_recovery_ttl: 604800
  shared_memory_report_ttl: 2592000

  default_task_type: generic
  task_embedding_strategy: hash_bow
  report_detail_level: full

  meta_update_frequency: 5
  auto_behavior_cloning_epochs: 1
  checkpoint_protocol: 5

  skills: {}
  handlers: {}
  env: {}


alignment_agent:
  safety_buffer: 0.10
  learning_rate: 0.01
  momentum: 0.90
  risk_threshold: 0.50
  alignment_ttl: 604800

  operation_limiter:
    max_requests: 10
    interval: 60
    penalty: "cool_down"

  weight:
    stat_parity: 0.40
    equal_opp: 0.40
    ethics: 0.20

  corrections:
    levels:
      - threshold: 0.80
        action: "human_intervention"
      - threshold: 0.50
        action: "automatic_adjustment"
      - threshold: 0.30
        action: "alert_only"

  fail_safe_action_space: []


browser_agent:
    max_retries: 3
    default_wait: 0.0
    default_search_engine: "https://www.google.com"
    headless: true
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    window_size: [1366, 920]


collaborative_agent:
    risk_threshold: 0.7
    max_concurrent_tasks: 100
    load_factor: 0.75
    optimization_weight_capability: 0.5
    optimization_weight_load: 0.3
    optimization_weight_risk: 0.2
    bayes_prior_alpha: 1.0
    bayes_prior_beta: 1.0
    use_collaboration_manager: true


evaluation_agent:
    risk_threshold: 0.5
    memory_warning_threshold: 0.7
    memory_critical_threshold: 0.9
    model_dir: "src/agents/evaluators/models/"
    anomaly_detector: "src/agents/evaluators/models/anomaly_detector.joblib"
    deep_anomaly: "src/agents/evaluators/models/deep_anomaly.pt"
    initial_hazard_rates:
        system_failure: 0.000001
        sensor_failure: 0.00001
        unexpected_behavior: 0.0001
    update_interval: 60.0
    decay_factor: 0.95
    risk_thresholds:
        warning: [0.4, 0.7]
        critical: [0.7, 1.0]
    risk_adaptation: {}
    autonomous_tasks:
        - id: "nav_test"
          type: "navigation"
          path: [[0, 0], [1, 1], [2, 2]]
          optimal_path: [[0, 0], [2, 2]]
          completion_time: 10.0
          energy_consumed: 100
          collisions: 0
          success: true


execution_agent: {}


handler_agent:
  enabled: true
  enable_recovery: true
  enable_observability: true
  enable_learning_loop: true
  enable_escalation: true
  enable_lightweight_fallback: true
  checkpoint_max_age_seconds: 600
  telemetry_buffer_size: 1000
  postmortem_buffer_size: 1000
  max_strategy_exceptions: 3
  default_failure_source: handler_agent
  fallback_strategy: runtime
  recovery_strategy_order:
    - network
    - timeout
    - memory
    - runtime
    - dependency
    - resource
    - unicode
  honor_retry_delay: false
  publish_last_execution_to_shared_memory: true
  publish_status_to_shared_memory: true
  shared_last_result_key: handler:agent:last_execution
  shared_status_key: handler:agent:status

  include_result_payload: true
  include_failed_checkpoint_state: false

  error_policy:
    name: handler_agent.default
    expose_internal_messages: false
    include_context_in_public: false
    include_context_in_telemetry: true
    include_traceback_in_internal: false
    allow_critical_retry: false
    max_message_chars: 500
    max_context_depth: 4
    max_context_items: 50
    max_sequence_items: 20
    max_string_chars: 500
    redaction_text: "[REDACTED]"


knowledge_agent:
    source: "local_files"
    is_query: True
    stopwords: "src/agents/language/resources/en/syntax_pack.yaml"
    knowledge_ontology_path: "src/agents/knowledge/utils/knowledge_ontology.db"
    use_graph_ontology: True  # False for in-memory
    ontology_threshold: 500   # Switch to graph DB at this size
    in_memory_cache: True  # Whether to keep in-memory cache
    cache_size: 1000
    bias_threshold: 0.87
    bias_detection_enabled: True
    embedding_model: "src/agents/knowledge/models/all-MiniLM-L6-v2"
    directory_path: "src/agents/knowledge/templates/"
    similarity_threshold: 0.35
    use_ontology_expansion: True
    first_pass: True
    decay_factor: 0.95
    context_window: 10
    knowledge_tag: "knowledge_snippet"
    ttl: 600
    retrieval_mode: "hybrid"
    safety_check_callback: foodie_security.validate_action
    max_workers: 8


language_agent: {}


learning_agent:
    rl_algorithm: null
    embedding_dim: 512
    strategy_weights: [0.25, 0.25, 0.25, 0.25]
    prediction_weights: [0.25, 0.25, 0.25, 0.25]
    maml_task_pool_size: 100
    rsi_improvement_cycle: 50
    performance_threshold: 0.7
    data_change_threshold: 0.15
    retraining_interval_hours: 24
    novelty_threshold: 0.3
    uncertainty_threshold: 0.25
    embedding_buffer_size: 512
    performance_history_size: 1000
    error_history_size: 100
    state_recency_size: 1000
    architecture_history_size: 10
    maml_adaptation_steps: 10
    task_embedding_dim: 256
    task_ids: ["dqn", "maml", "rsi", "rl"]
    batch_size: 32
    max_episode_steps: 128
    max_eval_episodes: 3
    recovery_trigger_threshold: 3
    deferred_init:
        max_network_size: 256
        max_task_pool: 50
        max_history: 500


network_agent:
    max_delivery_attempts: 3
    default_retry_profile: "default"
    queue_retry_profile: "queue_backpressure"
    retry_profile_by_channel:
        queue: "queue_backpressure"
        amqp: "queue_backpressure"
        kafka: "queue_backpressure"
    retry_sleep_enabled: False
    max_retry_sleep_ms: 1500
    default_receive_timeout_ms: 5000
    health_shared_key:
        network_agent: "health"
    last_result_shared_key:
        network_agent: "last_result"
    history_shared_key:
        network_agent: "history"
    max_history: 200


observability_agent:
    enabled: true
    default_service: "slai"
    default_task_name: "agent_workflow"
    default_trace_operation: "observe"
    default_incident_status: "open"

    auto_start_trace: true
    auto_finalize_trace: true
    enable_trace_span_ingestion: true
    enable_trace_event_ingestion: true
    enable_state_transition_ingestion: true
    enable_log_ingestion: true
    enable_performance_trace_analysis: true
    enable_health_snapshots: true
    enable_kpi_tracking: true
    enable_shared_context_export: true
    allow_degraded_reports: true

    max_recent_reports: 100
    max_recent_errors: 200
    max_signature_history: 512
    max_event_records_per_run: 200
    max_log_records_per_run: 200
    max_alert_records_per_run: 100
    max_error_records_per_run: 100
    max_state_transition_records_per_run: 200
    max_objective_records_per_run: 50
    max_related_agents: 16

    alert_dedupe_window_seconds: 1800.0
    alert_dedupe_repeat_threshold: 3
    recurring_incident_threshold: 2
    alert_precision_decay: 1.0
    degraded_status_levels: ["warning", "critical"]
    required_trace_context_fields: ["task_name", "agent_name", "operation_name"]

    routing:
        handler_on_warning: true
        handler_on_critical: true
        planning_on_capacity: true
        safety_on_critical: true
        evaluation_on_degradation: true
        handler_agent_names: ["handler", "handler_agent", "HandlerAgent"]
        planning_agent_names: ["planning", "planning_agent", "PlanningAgent"]
        safety_agent_names: ["safety", "safety_agent", "SafetyAgent"]
        evaluation_agent_names: ["evaluation", "evaluation_agent", "EvaluationAgent"]


perception_agent:
    device: "cpu"
    embed_dim: 512
    masking_ratio: 0.15
    contrastive_temperature: 0.07
    learning_rate: 0.0001
    weight_decay: 0.01
    adam_betas: [0.9, 0.999]
    adam_eps: 0.0000001
    loss_type: 'hybrid'  # mse, contrastive, or hybrid
    max_scale: 3
    temperature: 0.1
    mse_weight: 1.0     # for hybrid loss
    contrastive_weight: 1.0  # for hybrid loss


planning_agent: {}


privacy_agent:
  enabled: true
  fail_closed_on_subsystem_error: true
  include_evidence_bundle: true
  include_sanitized_payload_on_block: false

  default_policy_id: "privacy-runtime-policy"
  default_policy_version: "v1"
  default_source_context: "runtime"
  default_destination_context: "runtime"
  default_action: "process"
  default_purpose: "general_processing"
  default_retention_days: 30

  # Agent-owned orchestration labels. Subsystem stage labels stay in
  # privacy_config.yaml and are not duplicated here.
  post_minimization_stage: "privacy_agent.post_minimization_identification"
  runtime_gate_stage: "privacy_agent.runtime_gate"
  evidence_bundle_name: "privacy_runtime_bundle"

  # SLAI SharedMemory publication. This is NOT privacy_memory.py.
  shared_memory:
    enabled: true
    publish_notifications: true
    ttl_seconds: 86400

    # Detailed stage evidence can contain detector previews/path metadata and is
    # therefore excluded from SharedMemory by default.
    include_stage_evidence: false
    include_sanitized_payload: false
    include_evidence_bundle: false

    result_key_prefix: "privacy_agent.result"
    summary_key_prefix: "privacy_agent.summary"
    error_key_prefix: "privacy_agent.error"
    event_channel: "privacy.events"


qnn_agent:
  num_qubits: 4
  num_quantum_layers: 2
  learning_rate: 0.01
  seed: 42
  entanglement: linear
  loss: state_fidelity
  gradient_method: parameter_shift
  finite_difference_step: 1.0e-6
  gradient_clip_norm: 5.0


quality_agent:
  enabled: true
  default_window: latest

  # Core orchestration
  stop_on_blocking_structural: true
  fail_closed_on_subsystem_error: true
  auto_route_via_workflow: true
  prefer_workflow_verdict: true
  allow_workflow_verdict_relaxation: false
  include_workflow_findings_in_summary: true
  include_record_previews_in_shared_memory: false
  max_shared_record_preview: 5

  # Fallback agent-level policy. When intelligence.use_fitness_policy=true,
  # the active fitness profile supplies thresholds/weights per evaluation.
  pass_threshold: 0.90
  warn_threshold: 0.75

  # Aggregation/reporting order. Structural still executes first. With quality
  # intelligence enabled, SemanticQuality runs before StatisticalQuality because
  # trusted-baseline promotion needs provenance/source-reliability evidence.
  subsystem_order:
    - structural
    - statistical
    - semantic

  subsystem_weights:
    structural: 0.34
    statistical: 0.33
    semantic: 0.33

  bridge_resolution:
    resolve_handler_from_factory: false
    resolve_safety_from_factory: false
    handler_factory_names:
      - handler_agent
      - handler
      - HandlerAgent
    safety_factory_names:
      - safety_agent
      - safety
      - SafetyAgent

  shared_memory:
    enabled: true
    ttl_seconds: 86400
    publish_notifications: true
    result_key_prefix: quality_agent.result
    summary_key_prefix: quality_agent.summary
    error_key_prefix: quality_agent.error
    event_channel: quality.events

  # -----------------------------------------------------------------------
  # Agent-owned intelligence configuration.
  # These sections are injected into src/agents/quality/modules/*.py.
  # The intelligence modules MUST NOT read quality_config.yaml themselves.
  # -----------------------------------------------------------------------
  intelligence:
    enabled: true
    use_fitness_policy: true

    relationship_integration:
      enabled: true
      weight: 0.15
      apply_score_when_baseline_unavailable: false
      fail_closed_on_error: false

    # Monotonic dispositions: these can only make the final QualityAgent
    # posture more conservative, never less conservative.
    policy_enforcement:
      source_reliability_failure: warn
      trusted_baseline_missing: warn
      required_check_missing: warn
      insufficient_evidence: warn

    fitness_policy:
      enabled: true
      default_profile: general
      allow_runtime_overrides: false
      allow_runtime_relaxation: false
      allow_weight_overrides: false

      use_case_profiles:
        general: general
        knowledge_ingestion: knowledge_ingestion
        training: training
        replay: replay
        inference_context: inference_context
        memory_write: memory_write

      profiles:
        general:
          use_case: general
          pass_threshold: 0.90
          warn_threshold: 0.75
          subsystem_weights:
            structural: 0.34
            statistical: 0.33
            semantic: 0.33
          required_checks:
            - schema
            - provenance
          hard_block_error_types:
            - privacy_policy_conflict
          min_source_reliability: 0.50
          require_trusted_baseline: false
          baseline_bootstrap_allowed: true
          minimum_evidence_strength: moderate

        knowledge_ingestion:
          use_case: knowledge_ingestion
          pass_threshold: 0.91
          warn_threshold: 0.78
          subsystem_weights:
            structural: 0.34
            statistical: 0.26
            semantic: 0.40
          required_checks:
            - schema
            - provenance
            - consistency
          hard_block_error_types:
            - provenance_untrusted
            - privacy_policy_conflict
          min_source_reliability: 0.65
          require_trusted_baseline: false
          baseline_bootstrap_allowed: true
          minimum_evidence_strength: moderate

        training:
          use_case: training
          pass_threshold: 0.94
          warn_threshold: 0.82
          subsystem_weights:
            structural: 0.30
            statistical: 0.30
            semantic: 0.40
          required_checks:
            - schema
            - leakage
            - provenance
            - drift
            - relationship_drift
          hard_block_error_types:
            - leakage_detected
            - provenance_untrusted
            - privacy_policy_conflict
          min_source_reliability: 0.75
          require_trusted_baseline: true
          baseline_bootstrap_allowed: false
          minimum_evidence_strength: strong

        replay:
          use_case: replay
          pass_threshold: 0.92
          warn_threshold: 0.80
          subsystem_weights:
            structural: 0.32
            statistical: 0.34
            semantic: 0.34
          required_checks:
            - schema
            - duplicates
            - drift
            - provenance
          hard_block_error_types:
            - leakage_detected
            - privacy_policy_conflict
          min_source_reliability: 0.70
          require_trusted_baseline: true
          baseline_bootstrap_allowed: false
          minimum_evidence_strength: strong

        inference_context:
          use_case: inference_context
          pass_threshold: 0.92
          warn_threshold: 0.80
          subsystem_weights:
            structural: 0.32
            statistical: 0.25
            semantic: 0.43
          required_checks:
            - schema
            - provenance
            - consistency
          hard_block_error_types:
            - provenance_untrusted
            - privacy_policy_conflict
          min_source_reliability: 0.70
          require_trusted_baseline: false
          baseline_bootstrap_allowed: false
          minimum_evidence_strength: strong

        memory_write:
          use_case: memory_write
          pass_threshold: 0.93
          warn_threshold: 0.82
          subsystem_weights:
            structural: 0.35
            statistical: 0.25
            semantic: 0.40
          required_checks:
            - schema
            - provenance
            - consistency
          hard_block_error_types:
            - provenance_untrusted
            - privacy_policy_conflict
          min_source_reliability: 0.75
          require_trusted_baseline: false
          baseline_bootstrap_allowed: false
          minimum_evidence_strength: strong

    baseline_governance:
      enabled: true
      metric_name: dataset_profile
      min_stable_batches: 3
      min_source_reliability: 0.70
      allowed_structural_verdicts:
        - pass
      allowed_semantic_verdicts:
        - pass
        - warn
      max_quality_score_delta: 0.08
      max_baseline_age_seconds: 2592000
      trust_explicit_baseline: false
      require_schema_match: true
      persist_trusted_baselines: true

      # Compatibility with the current QualityMemory public API.
      allow_export_state_fallback: true

      # Do not silently trust baselines created by the old auto-register path.
      accept_legacy_baselines: false

      # Required if min_stable_batches > 1 and QualityMemory is expected to
      # supply historical evidence for candidate promotion.
      use_memory_snapshot_history: true
      history_limit: 12

    relationship_quality:
      enabled: true
      profile_metric_name: relationship_profile

      # Bounds O(p^2) relationship evaluation.
      max_numeric_fields: 30
      min_pair_observations: 20

      # Effect-size thresholds.
      min_absolute_baseline_correlation: 0.20
      warn_correlation_delta: 0.20
      block_correlation_delta: 0.40
      warn_missingness_delta: 0.20
      block_missingness_delta: 0.40

      # Significance supports an effect-size decision; significance alone
      # never creates a block.
      significance_alpha: 0.05
      require_statistical_support_for_block: true

      pass_threshold: 0.90
      warn_threshold: 0.75

      exclude_fields:
        - record_id
        - id
        - row_id
        - sample_id
        - uuid
        - created_at
        - updated_at
        - timestamp
        - batch_id
        - source_id

      remediation_actions:
        warn:
          - review_feature_relationships
          - compare_recent_batches
          - review_upstream_transformations
        block:
          - quarantine_relationship_shifted_batch
          - revalidate_upstream_transformations
          - rebuild_trusted_baseline
          - review_feature_engineering

    evidence_calibration:
      enabled: true
      confidence_level: 0.95
      sample_support_scale: 50.0

      component_weights:
        sample_support: 0.30
        coverage: 0.20
        baseline_trust: 0.20
        source_reliability: 0.15
        detector_agreement: 0.15

      strength_thresholds:
        weak: 0.35
        moderate: 0.55
        strong: 0.75
        very_strong: 0.90

      baseline_trust_scores:
        not_applicable: 1.00
        unestablished: 0.00
        rejected: 0.00
        candidate: 0.35
        stale: 0.30
        superseded: 0.20
        trusted: 0.90
        active: 1.00

      batch_aggregation:
        mean_weight: 0.70
        minimum_weight: 0.30


reader_agent:
  enabled: true
  output_dir: output/reader
  default_output_format: txt
  max_concurrency: 4
  fail_fast: false
  dedupe_files: true

  # Recovery trigger owned by the agent orchestration layer.
  # Actual RecoveryEngine thresholds/policy remain in reader_config.yaml.
  auto_recover_low_quality: true
  low_quality_threshold: 0.55

  # Result shaping. Keep full content out of normal agent responses/checkpoints unless requested.
  include_documents_by_default: false
  include_content_by_default: false
  max_result_documents: 50
  use_shared_cache: true
  cache_ttl_seconds: 0
  cache_key_prefix: reader_agent.cache
  cache_parse_results: true
  cache_recovery_results: true

  # SharedMemory-backed checkpoints and observability.
  write_checkpoints: true
  checkpoint_key_prefix: reader_agent.checkpoint
  checkpoint_index_key: reader_agent.checkpoints
  max_checkpoint_index_entries: 250
  redact_checkpoints: true
  publish_events: true
  event_channel: reader.events
  result_key_prefix: reader_agent.result
  summary_key_prefix: reader_agent.summary
  error_key_prefix: reader_agent.error

  # Error behavior. Set raise_on_pipeline_error=true when you want BaseAgent's issue
  # recovery envelope to receive exceptions instead of structured Reader error results.
  raise_on_pipeline_error: false
  include_debug_errors: false
  include_traceback_errors: false

  # Transient operation retry policy used around parser/recovery/conversion calls.
  retry_max_attempts: 2
  retry_base_delay_seconds: 0.15
  retry_max_delay_seconds: 2.0
  retry_backoff_factor: 2.0
  retry_jitter_ratio: 0.10


reasoning_agent:
  learning_rate: 0.05
  exploration_rate: 0.1
  tuple_key:
  - subject
  - predicate
  - object
  hypothesis_graph:
    nodes: {}
    edges: {}
    confidence: 0.0
  decay: 0.95
  knowledge_db: src/agents/knowledge/templates/knowledge_db.json
  glove_path: data/embeddings/glove.6B.200d.json
  ner_tag: None
  embedding: None
  max_iterations: 20
  contradiction_threshold: 0.25
  redundancy_margin: 0.05
  large_kb_threshold: 500
  low_confidence_threshold: 0.4
  max_action_results: 20
  max_chain_depth: 4
  max_react_steps: 5
  max_trace_items: 250
  enable_shared_memory_publish: true
  enable_knowledge_persistence: true
  enable_memory_logging: true
  enable_probabilistic_fallback: true
  auto_register_builtin_rules: true
  strict_fact_validation: true
  human_intervention_key: human_intervention_requests
  knowledge_memory_key: reasoning_agent:knowledge_base
  last_validation_key: reasoning_agent:last_validated_fact
  reasoning_trace_topic: reasoning_trace
  memory_event_tag: reasoning_agent
  memory_event_priority: 0.75
  strategy_default: deduction
  reasoning_type_aliases:
    deductive: deduction
    inductive: induction
    abductive: abduction
    causal: cause_effect
    cause-and-effect: cause_effect
    decomposition: decompositional
    analytical: analogical
    analitical: analogical
  builtin_rule_weights:
    identity_rule: 1.0
    transitive_rule: 0.8


safety_agent:
  enabled: true
  schema_version: safety_agent.v4

  max_input_text_length: 12000
  max_output_text_length: 12000
  audit_level: 2
  collect_feedback: true
  enable_learnable_aggregation: false
  fail_closed_on_component_error: true
  sanitization_depth: full
  empty_assessment_risk: 0.50
  assessment_history_limit: 500
  audit_trail_limit: 1000
  verbose_console: false

  output:
    max_collection_items: 250

  components:
    safety_guard:
      enabled: true
      required: true
      authority: enforcing
    cyber_safety:
      enabled: true
      required: true
      authority: enforcing
    adaptive_security:
      enabled: true
      required: false
      authority: enforcing
    attention_monitor:
      enabled: true
      required: false
      authority: advisory
    reward_model:
      enabled: true
      required: true
      authority: corroborating
    compliance_checker:
      enabled: true
      required: false
      authority: enforcing
    secure_stpa:
      enabled: true
      required: true
      authority: enforcing
    secure_hacker:
      enabled: true
      required: false
      authority: corroborating

  orchestration:
    fail_startup_on_required_component_error: true
    review_on_required_component_degraded: false
    required_error_risk: 1.00
    optional_error_risk: 0.55

  performance:
    max_assessment_ms: 5000
    slow_component_ms: 750
    review_on_budget_exceeded: false

  risk_thresholds:
    overall_safety: 0.85
    cyber_risk: 0.70
    review_threshold: 0.45
    block_threshold: 0.75
    compliance_failure_is_blocker: true
    mandatory_compliance_failure_risk: 0.95

  # Retained as the agent-level component weighting contract. Final content
  # assessment uses the family-level weights below to avoid double-counting
  # correlated detectors.
  aggregation_weights:
    safety_guard: 0.30
    cyber_safety: 0.20
    adaptive_security: 0.15
    reward_model: 0.20
    attention_monitor: 0.05
    compliance: 0.05
    constitutional: 0.05
    secure_hacker: 0.05
    secure_stpa: 0.10

  correlation:
    enabled: true
    corroboration_factor: 0.20
    degraded_uncertainty_uplift: 0.08
    max_degraded_uplift_components: 3

    component_families:
      safety_guard: content
      reward_model: content
      cyber_safety: cyber
      adaptive_security: phishing
      attention_monitor: telemetry
      compliance: governance
      constitutional: constitutional
      secure_hacker: adversarial_regression
      secure_stpa: systems

    family_weights:
      content: 0.30
      cyber: 0.18
      phishing: 0.12
      telemetry: 0.04
      governance: 0.08
      constitutional: 0.12
      adversarial_regression: 0.06
      systems: 0.10

  task_thresholds:
    general: 0.75
    cyber_security: 0.80
    privacy: 0.85
    execution: 0.85
    user_creation: 0.80

  shared_memory:
    enabled: true
    key_prefix: safety_agent
    store_assessments: true
    store_audit_events: true
    fail_closed_on_write_error: false
    assessment_ttl_seconds: 604800
    validation_ttl_seconds: 604800
    audit_ttl_seconds: 2592000
    feedback_ttl_seconds: 2592000
    posture_ttl_seconds: 604800

  compliance:
    evaluate_on_task: false
    evaluate_every_n_calls: 0
    evaluate_contexts:
      - compliance
      - governance

  posture:
    include_compliance: true
    assessment_sample_size: 25
    required_component_failure_risk: 0.80

  action_validation:
    stpa_match_threshold: 0.70
    require_human_review_above: 0.45
    block_above: 0.75

  adversarial_validation:
    enabled: true
    auto_run_on_risk: true
    trigger_risk: 0.55
    techniques:
      - case_variation
      - whitespace_variation
      - punctuation_separation
      - unicode_normalization
      - zero_width_obfuscation
      - line_break_variation

  constitutional:
    block_on_violation: true
    redact_on_violation: true
    block_message: "[SAFETY_BLOCK] Output violates configured safety policy."

    severity_risk:
      low: 0.35
      medium: 0.55
      high: 0.75
      critical: 0.95

    checks:
      - rule_id: SAFETY-SELF-HARM
        category: safety
        severity: critical
        description: Blocks explicit self-harm encouragement or facilitation.
        patterns:
          - '\bkill yourself\b'
          - '\bend my life\b'
          - '\bsuicide instructions\b'

      - rule_id: PRIVACY-CREDENTIALS
        category: privacy_security
        severity: high
        description: Flags raw credential or secret disclosure in agent output or action text.
        patterns:
          - '(?i)\b(api[_-]?key|password|secret|token)\s*[:=]'

      - rule_id: SECURITY-BYPASS
        category: security
        severity: high
        description: Flags requests or actions attempting to bypass safety or security controls.
        patterns:
          - '(?i)ignore\s+(all\s+)?previous\s+instructions'
          - '(?i)\bjailbreak\b'
          - '(?i)disable\s+safety'

  incident_response:
    default:
      - Contain operation
      - Preserve audit evidence
      - Route for human review
    privacy:
      - Isolate affected data path
      - Notify privacy owner
      - Preserve redacted audit evidence
    safety:
      - Block unsafe operation
      - Escalate to safety owner
      - Review related prompts or actions
    cyber_security:
      - Quarantine suspicious artifact
      - Correlate cyber findings
      - Escalate to security owner

  feedback:
    min_samples_for_retrain: 25
    store_feedback: true
    local_buffer_limit: 1000

  compatibility:
    pii_count_for_max_risk: 5
    adversarial_match_risk: 0.75

  adversarial_patterns:
    - '(?i)ignore\s+(all\s+)?previous\s+instructions'
    - '(?i)developer\s+mode'
    - '(?i)\bjailbreak\b'
    - '(?i)system\s+prompt'

  # Agent-owned STPA orchestration inputs. SecureSTPA remains responsible for
  # its own subsystem-internal implementation/configuration.
  system_boundary: Safety Agent orchestration boundary
  architecture_map: {}
  system_models: {}
  known_hazards: []
  global_losses: []
  safety_policies: []
  formal_specs: {}
  fault_tree_config: {}

