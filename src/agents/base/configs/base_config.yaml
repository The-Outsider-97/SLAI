src_vocab_size: 50000
tgt_vocab_size: 50000
bpe_model_path: "data/bpe_200d_50k_model.json"
bpe_vocab_path: "data/bpe_200d_50k_vocab.json"


base_error:
  default_severity: medium
  include_traceback: true


base_memory:
  default_namespace: default
  max_entries: 10000
  max_entries_per_namespace: 2500
  default_ttl_seconds: null
  cleanup_interval_seconds: 60
  enable_history: true
  history_limit: 500
  enable_persistence: false
  auto_persist: false
  auto_load_persistence: false
  persistence_path: data/base_memory_snapshot.json
  enable_fingerprints: true
  enforce_capacity_on_write: true
  export_redact_secrets: false
  snapshot_pretty: true
  max_query_results: 100
  eviction_policy: least_recently_used


base_transformer:
  src_vocab_size: 50000
  tgt_vocab_size: 50000
  d_model: 512
  nhead: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  dim_feedforward: 2048
  dropout: 0.1
  activation: relu
  layer_norm_eps: 1.0e-05
  batch_first: true
  norm_first: false
  max_len: 5000
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  tie_embeddings: false
  tie_output_projection: true
  enable_memory_integration: false
  memory_namespace: base_transformer
  record_history: true
  history_limit: 200
  checkpoint_pretty: true
  label_smoothing: 0.0
  clip_grad: 1.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0001
  inference_max_len: 50
  inference_temperature: 1.0
  inference_do_sample: false
  inference_top_k: 0


inference:
  max_len: 50
  sos_token: 1
  eos_token: 2
  temperature: 1.0


forward:
  src_mask: None
  tgt_mask: None
  memory_mask: None
  src_key_padding_mask: None
  tgt_key_padding_mask: None
  memory_key_padding_mask: None


base_tokenizer:
  src_vocab_size: 50000
  max_vocab_size: 50000
  min_frequency: 2
  bpe_model_path: "data/bpe_200d_50k_model.json"
  bpe_vocab_path: "data/bpe_200d_50k_vocab.json"
  pad_token: "[PAD]"
  unk_token: "[UNK]"
  bos_token: "[BOS]"
  eos_token: "[EOS]"
  mask_token: "[MASK]"
  special_tokens: null
  lowercase: true
  unicode_normalization_form: "NFKC"
  remove_control_characters: true
  squeeze_whitespace: true
  track_token_counts: true
  allow_dynamic_vocab_growth: true
  record_history: true
  history_limit: 200
  enable_memory_integration: false
  memory_namespace: "base_tokenizer"
  snapshot_pretty: true
  default_max_length: 128
  default_padding: "max_length"
  default_truncation: true
  default_add_special_tokens: true
  default_return_tensors: null
  return_attention_mask: true
  return_special_tokens_mask: false
  return_tokens: false


encode:
  max_length: None
  padding: "max_length"
  truncation: True
  add_special_tokens: True
  return_tensors: None
  src_mask: None
  src_key_padding_mask: None


decode:
  skip_special_tokens: True
  clean_up_tokenization_spaces: True
  tgt_mask: None
  memory_mask: None
  tgt_key_padding_mask: None
  memory_key_padding_mask: None


lm_store:
  enable_memory_tracking: true
  default_category: "performance"
  max_history_size: 1000
  max_records_per_metric: 250
  max_active_trackers: 2048
  auto_prune_empty_categories: true
  enable_snapshots: true
  auto_snapshot: false
  snapshot_pretty: true
  snapshot_path: "data/light_metric_store_snapshot.json"
  summary_sort_by: "average"


issue_handler:
  enable_history: true
  history_limit: 250
  enable_shared_memory_learning: true
  shared_memory_error_key_prefix: "errors"
  error_similarity_threshold: 0.72
  max_retry_attempts: 3
  max_solution_attempts: 3
  runtime_retry_delay_seconds: 1.0
  memory_trim_ratio: 0.5
  timeout_simplified_dict_items: 3
  unicode_strip_non_ascii: true
  enable_traceback_capture: true
  export_redact_secrets: false
  max_error_message_length: 500
  network_backoff_initial_delay: 1.0
  network_backoff_multiplier: 2.0
  network_backoff_max_delay: 30.0
  network_backoff_jitter_ratio: 0.0
  resource_wait_schedule: [2.0, 5.0, 10.0]


lazy_agent:
  max_init_attempts: 3
  enable_init_logging: true
  timeout_seconds: 30.0
  retry_initial_delay: 0.5
  retry_multiplier: 2.0
  retry_max_delay: 5.0
  capture_tracebacks: true
  enable_internal_memory: false
  memory_namespace: "lazy_agent"
  record_access_history: true
  history_limit: 100
  allow_reset: true
  strict_none_return: true
  enable_proxy_call: true


chemistry_constraints:
  dt: 0.02
  activity_floor: 1.0e-12
  numeric_tolerance: 1.0e-12
  enable_history: true
  history_limit: 200
  species_map:
    A: 0
    B: 1
    C: 2
    D: 3
    Cat: 4
    temperature: 5
    H+: 6
    volume: 7
  reaction_stoichiometry:
    A: -1.0
    B: -1.0
    C: 1.0
    D: 1.0
  reaction_orders_fwd: {}
  reaction_orders_rev: {}
  k_fwd_params:
    A0: 1.0
    Ea: 40000.0
  k_rev_params:
    A0: 0.1
    Ea: 42000.0
  enable_catalysis: true
  catalyst_species: "Cat"
  catalyst_min_active_conc: 1.0e-9
  catalyst_concentration_factor: 0.25
  catalyst_params:
    Ea_reduction_factor_fwd: 0.8
    Ea_reduction_factor_rev: 0.8
  enable_ph_modulation: true
  ph_species: "H+"
  ph_optimum: 7.0
  ph_sensitivity: 0.35
  ph_min: 0.0
  ph_max: 14.0
  delta_H_reaction: 0.0
  system_properties:
    density_solution_kg_L: 1.0
    cp_solution_J_kg_K: 4184.0
  min_temperature_K: 0.0
  max_temperature_K: 5000.0
  min_volume_L: 1.0e-9
  max_volume_L: 1.0e9
  solubility_limits: {}
  clip_negative_concentrations: true
  max_concentration_mol_L: 1.0e6
  enforce_mass_balance: false
  auto_correct_mass_balance: false
  element_matrix: {}
  initial_total_moles: {}
  mass_balance_tolerance: 1.0e-6


physics_constraints:
  gravity: 9.80665
  friction_coeff: 0.02
  rotational_friction: 0.01
  wind_strength: 0.0
  wind_direction: 0.0
  wind_turbulence_ratio: 0.1
  drag_coeff: 0.01
  terminal_velocity: 50.0
  min_speed_for_drag: 0.01
  elasticity: 0.8
  tangential_damping: 0.2
  boundary_margin: 0.01
  corner_threshold: 0.05
  max_angular_velocity: 5.0
  default_mass: 1.0
  default_charge: 0.0
  enable_tunneling: false
  tunneling_probability: 0.05
  barrier_positions: [-8.0, 8.0]
  barrier_width: 0.1
  enable_relativistic: true
  relativistic_threshold: 0.1
  relativistic_safety_factor: 0.999999
  enable_electromagnetic: false
  electric_field: [0.0, 10.0]
  magnetic_field: 0.5
  dt: 0.02
  enable_history: true
  history_limit: 200
  random_seed: null
  # classical
  body_radius: 0.5
  buoyancy_enabled: true
  fluid_density: 997.0
  magnus_coeff: 0.02
  pendulum_enabled: false
  pendulum_length: 1.0
  pendulum_anchor: [0.0, 0.0]
  spring_constants: [50.0]
  spring_anchors: [[0.0, 2.0]]
  spring_damping: 0.5
  nbody_G_enabled: false
  nbody_masses: [1.0, 1.0]
  nbody_positions: [[-5.0, 0.0], [5.0, 0.0]]

  # thermodynamics
  enable_thermodynamics: true
  ambient_temperature: 293.15
  body_temperature: 300.0
  heat_transfer_coeff: 5.0
  emissivity: 0.9
  specific_heat: 4186.0

  # EM
  enable_electromagnetic: true
  electric_field: [0.0, 10.0]
  magnetic_field: 0.5
  enable_coulomb: true
  other_charges: [[[3.0, 0.0], -1e-6]]
  enable_radiation_pressure: false

  # relativity
  enable_relativistic: true
  enable_time_dilation: true
  enable_length_contraction: true

  # quantum
  enable_wkb_tunneling: false
  particle_mass_kg: 9.11e-31

  # materials
  enable_material_stress: true
  youngs_modulus: 2.0e11
  yield_strength: 2.5e8
  fracture_strain: 0.05

  # constraints
  max_velocity: 1.0e6
  max_acceleration: 1.0e9
  max_jerk: 1.0e12

  # audit
  enable_conservation_audit: true
  energy_tolerance: 1e-4


base_engineering:
  # ------------------------- Engine-level -------------------------
  enable_history: true
  history_limit: 200
  numeric_tolerance: 1.0e-12
  strict_checks: false
  default_safety_factor: 1.5
  check_warn_utilization: 0.9
  check_critical_utilization: 1.5
  sampling_oversample_factor: 2.5
  default_material: structural_steel_a36

  # ------------------------- Material library ---------------------
  # Every entry must define exactly these five keys:
  #   youngs_modulus [Pa], yield_strength [Pa], ultimate_strength [Pa],
  #   density [kg/m^3], poissons_ratio [-]
  materials:
    structural_steel_a36:
      youngs_modulus: 2.00e11
      yield_strength: 2.50e8
      ultimate_strength: 4.00e8
      density: 7850.0
      poissons_ratio: 0.26
    stainless_steel_304:
      youngs_modulus: 1.93e11
      yield_strength: 2.15e8
      ultimate_strength: 5.05e8
      density: 8000.0
      poissons_ratio: 0.29
    aluminum_6061_t6:
      youngs_modulus: 6.90e10
      yield_strength: 2.76e8
      ultimate_strength: 3.10e8
      density: 2700.0
      poissons_ratio: 0.33
    titanium_ti6al4v:
      youngs_modulus: 1.14e11
      yield_strength: 8.80e8
      ultimate_strength: 9.50e8
      density: 4430.0
      poissons_ratio: 0.34
    copper_c110:
      youngs_modulus: 1.17e11
      yield_strength: 6.90e7
      ultimate_strength: 2.20e8
      density: 8960.0
      poissons_ratio: 0.34

  # ------------------------- Medical ------------------------------
  medical:
    bsa_formula: mosteller          # mosteller | dubois | haycock
    qt_formula: bazett              # bazett | fridericia | framingham | hodges
    hemoglobin_binding_capacity_ml_per_g: 1.34
    oxygen_solubility_ml_per_dl_per_mmhg: 0.003
    water_vapor_pressure_mmhg: 47.0
    respiratory_quotient: 0.8
    atmospheric_pressure_mmhg: 760.0
    spo2_ratio_intercept: 110.0
    spo2_ratio_slope: 25.0
    blood_viscosity_pa_s: 0.0035

    # ICRP-103 style weighting factors (dimensionless)
    radiation_weighting_factors:
      photons: 1.0
      electrons: 1.0
      protons: 2.0
      neutrons: 20.0
      alpha: 20.0
      fission_fragments: 20.0

    # ICRP-103 tissue weights; MUST sum to 1.0 (validated at load time).
    tissue_weighting_factors:
      gonads: 0.08
      red_bone_marrow: 0.12
      colon: 0.12
      lung: 0.12
      stomach: 0.12
      bladder: 0.04
      breast: 0.12
      liver: 0.04
      esophagus: 0.04
      thyroid: 0.04
      skin: 0.01
      bone_surface: 0.01
      brain: 0.01
      salivary_glands: 0.01
      remainder: 0.12

    # IEC 60601-1 inspired patient leakage current limits (microamps).
    leakage_current_limits_ua:
      b:
        normal: 100.0
        single_fault: 500.0
      bf:
        normal: 100.0
        single_fault: 500.0
      cf:
        normal: 10.0
        single_fault: 50.0

    # Adult resting reference ranges (low, high) -- engineering QA, not clinical.
    vital_sign_ranges:
      heart_rate_bpm: [60.0, 100.0]
      systolic_mmhg: [90.0, 120.0]
      diastolic_mmhg: [60.0, 80.0]
      respiratory_rate_bpm: [12.0, 20.0]
      spo2_percent: [95.0, 100.0]
      temperature_c: [36.1, 37.2]

    # Diagnostic-signal bands (Hz) used to derive minimum sampling rates.
    biosignal_bands_hz:
      ecg: [0.05, 150.0]
      eeg: [0.5, 100.0]
      emg: [10.0, 500.0]
      ppg: [0.5, 10.0]
      respiration: [0.1, 3.0]

  # ------------------------- Civil --------------------------------
  civil:
    dead_load_factor: 1.2
    live_load_factor: 1.6
    deflection_limit_ratio: 360.0
    concrete_modulus_coefficient: 4700.0
    flexural_resistance_factor: 0.9
    rebar_yield_strength_pa: 4.2e8
    concrete_stress_block_factor: 0.85
    tension_controlled_c_over_d: 0.375
    bearing_capacity_safety_factor: 3.0
    soil_unit_weight_n_m3: 18000.0
    seismic_importance_factor: 1.0
    seismic_response_modification: 3.0
    seismic_min_cs_sds_coefficient: 0.044
    seismic_min_cs: 0.01
    runoff_coefficient: 0.7
    manning_roughness: 0.013
    effective_length_factor: 1.0

  # ------------------------- Computer -----------------------------
  computer:
    max_cpu_utilization: 0.8
    availability_target: 0.999
    dynamic_power_activity_factor: 0.1

  # ------------------------- Electronics / Comms ------------------
  electronics_comms:
    resistor_power_derating: 0.5
    max_junction_temperature_c: 125.0
    battery_derating_factor: 0.8
    copper_resistivity_ohm_m: 1.68e-8
    copper_temp_coefficient_per_c: 0.00393
    reference_conductor_temperature_c: 20.0
    noise_temperature_k: 290.0
    antenna_efficiency: 0.55
    required_link_margin_db: 6.0

  # ------------------------- Mechanical ---------------------------
  mechanical:
    bolt_torque_coefficient: 0.2
    bolt_preload_proof_fraction: 0.75
    gear_stage_efficiency: 0.98
    bearing_ball_exponent: 3.0
    bearing_roller_exponent: 3.3333333333333335   # = 10 / 3
    thin_wall_ratio_limit: 10.0
    pipe_roughness_m: 4.5e-5
    pump_efficiency: 0.7
    laminar_reynolds_limit: 2300.0
    fluid_viscosity_pa_s: 8.9e-4
    endurance_ratio: 0.5
    endurance_limit_cap_pa: 7.0e8


input_sanitizer:
  unicode_normalization_form: "NFKC"
  strip_control_characters: true
  strip_null_bytes: true
  squeeze_whitespace: true
  strip_edges: true
  escape_html: true
  lowercase: false
  allow_newlines: false
  preserve_tabs: false
  max_text_length: 4096
  filename_max_length: 128
  max_container_items: 1000
  max_recursion_depth: 8
  record_history: true
  history_limit: 200
  reject_on_suspicious_patterns: false
  default_allow_null: false
  sanitize_keys: true
  default_paranoid_mode: false
  paranoid_escape_quotes: true
  allowed_text_pattern: null
  replacement_map: {}
  suspicious_patterns:
    - '(?i)<script\b'
    - '(?i)javascript:'
    - '(?i)on[a-z]+\s*='
    - '(?i)<iframe\b'
    - '(?i)<object\b'


numpy_encoder:
  array_format: "tagged"
  encode_scalar_metadata: false
  encode_datetime_as: "iso"
  encode_timedelta_as: "int"
  handle_non_finite: "string"
  include_array_dtype: true
  include_array_shape: true
  include_array_size: false
  serialize_callables: true
  serialize_custom_objects: true
  custom_object_strategy: "dict"
  decode_tagged_payloads: true
  record_history: true
  history_limit: 200
  max_history_detail_length: 240
  max_array_preview_items: 25
  strict_numpy_only: false
  ensure_ascii_default: false
  sort_keys_default: true
  indent_default: null
