# ============================================================================
# SLAI Simulation subsystem configuration.
# All sections are optional; omitted keys fall back to in-code defaults.
# ============================================================================

simulation_analysis:
  confidence_level: 0.95
  convergence_tolerance: 0.01
  convergence_min_samples: 30
  convergence_window: 20

simulation_memory:
  max_records: 256
  store_request_payloads: true
  store_result_payloads: false

simulation_model:
  allow_replace: false

state_transition:
  max_state_size: 1000000
  clone_input_state: true
  clone_output_state: true

stochastic_model:
  probability_tolerance: 1.0e-9

world_model:
  model_id: "world-model"

base_engine:
  max_rollout_depth: 10000
  max_state_size: 1000000
  pretty_progress: false
  timeout_seconds: null
  state_transition:
    max_state_size: 1000000
    clone_input_state: true
    clone_output_state: true

rollout_engine:
  base_engine:
    max_rollout_depth: 10000
    max_state_size: 1000000
    pretty_progress: false
    timeout_seconds: null
    state_transition:
      max_state_size: 1000000
      clone_input_state: true
      clone_output_state: true
  monte_carlo:
    sample_count: 100
    max_samples: 10000
    concurrency: 1
    continue_on_error: false
    timeout_seconds: null

scenario_engine:
  base_engine:
    max_rollout_depth: 10000
    max_state_size: 1000000
    pretty_progress: false
    timeout_seconds: null
    state_transition:
      max_state_size: 1000000
      clone_input_state: true
      clone_output_state: true
  max_branches: 256
  max_depth: 8
  sampling:
    sample_count: 100
    max_samples: 10000
    concurrency: 1
    continue_on_error: false
    timeout_seconds: null

monte_carlo:
  sample_count: 100
  max_samples: 10000
  concurrency: 1
  continue_on_error: false
  timeout_seconds: null