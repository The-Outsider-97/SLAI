structural_quality:
  enabled: true
  auto_record_to_memory: true
  default_window: latest
  ids:
    record_id_candidates:
      - record_id
      - id
      - row_id
      - sample_id
      - uuid
  scoring:
    pass_threshold: 0.9
    warn_threshold: 0.75
    weights:
      schema: 0.35
      required: 0.25
      range: 0.15
      domain: 0.15
      coercion: 0.1
  schema:
    strict_unknown_fields: false
    allow_missing_schema: false
    read_expected_schema_from_memory: true
    write_schema_to_memory: true
    enforce_schema_version_match: true
    infer_types_from_samples: true
    max_schema_inference_records: 100
  completeness:
    allow_empty_strings: false
    warn_missing_record_rate: 0.05
    block_missing_record_rate: 0.15
    warn_missing_field_rate: 0.08
    block_missing_field_rate: 0.2
  coercion:
    enabled: true
    apply_coerced_values: false
    warn_rate: 0.05
    block_rate: 0.2
    truthy_values: ['true', '1', 'yes', y, 'on']
    falsy_values: ['false', '0', 'no', n, 'off']
    datetime_formats:
      - '%Y-%m-%dT%H:%M:%S'
      - '%Y-%m-%d %H:%M:%S'
      - '%Y-%m-%d'
      - '%Y/%m/%d'
  constraints:
    range_warn_violation_rate: 0.03
    range_block_violation_rate: 0.1
    domain_warn_violation_rate: 0.03
    domain_block_violation_rate: 0.1
    regex_warn_violation_rate: 0.02
    regex_block_violation_rate: 0.08
    unknown_field_warn_rate: 0.05
    unknown_field_block_rate: 0.15
  remediation:
    schema_actions:
      - normalize_schema
      - drop_invalid_records
      - re_fetch_malformed_records
      - align_schema_version
    required_actions:
      - impute_required_fields
      - re_fetch_incomplete_records
      - quarantine_incomplete_records
      - enforce_required_field_contract
    range_actions:
      - clamp_numeric_range
      - quarantine_out_of_range_records
      - review_upstream_transformations
    domain_actions:
      - normalize_enum_values
      - quarantine_invalid_domain_records
      - review_source_contract
    coercion_actions:
      - stabilize_type_casting
      - review_upstream_serialization
      - tighten_reader_normalization
  memory:
    record_quality_snapshot: true
    register_schema_version: true
    rule_id_prefix: structural

statistical_quality:
  enabled: true
  auto_record_to_memory: true
  default_window: latest
  ids:
    record_id_candidates:
      - record_id
      - id
      - row_id
      - sample_id
      - uuid
  baseline:
    # Keep true until BaselineGovernor is wired into QualityAgent and its trusted
    # baseline is passed explicitly into StatisticalQuality.assess_batch().
    auto_register_if_missing: true
    read_from_memory: true
    write_to_memory: true
  scoring:
    pass_threshold: 0.9
    warn_threshold: 0.75
    weights:
      drift: 0.35
      missingness: 0.25
      duplicates: 0.2
      outliers: 0.2
  missingness:
    required_fields: []
    warn_total_rate: 0.05
    block_total_rate: 0.12
    warn_field_rate: 0.1
    block_field_rate: 0.25
    anomaly_stddev_multiplier: 2.0
  duplicates:
    warn_rate: 0.03
    block_rate: 0.1
    fingerprint_fields_exclude:
      - id
      - record_id
      - uuid
      - created_at
      - updated_at
      - timestamp
    key_fields:
      - value
      - score
      - category
      - status
  outliers:
    enabled: true
    min_numeric_observations: 8
    zscore_threshold: 3.0
    iqr_multiplier: 1.5
    warn_rate: 0.04
    block_rate: 0.1
    max_fields: 100
  drift:
    enabled: true
    min_observations: 12
    warn_score: 0.35
    block_score: 0.7
    numeric_mean_relative_warn: 0.2
    numeric_mean_relative_block: 0.45
    numeric_std_ratio_warn: 1.75
    numeric_std_ratio_block: 2.5
    categorical_js_warn: 0.08
    categorical_js_block: 0.18
    missing_rate_delta_warn: 0.05
    missing_rate_delta_block: 0.12
    exclude_fields:
      - record_id
      - id
      - row_id
      - sample_id
      - uuid
      - created_at
      - updated_at
      - timestamp
      - batch_id
  remediation:
    missingness_actions:
      - impute_missing_values
      - re_fetch_incomplete_records
      - quarantine_incomplete_records
    duplicate_actions:
      - drop_duplicate_records
      - merge_duplicate_records
      - enforce_identity_constraints
      - review_source_replay
    outlier_actions:
      - winsorize_extreme_values
      - quarantine_outlier_records
      - review_numeric_scaling
      - revalidate_sensor_or_source
    drift_warn_actions:
      - monitor_next_batches
      - compare_to_recent_baseline
      - review_segment_distribution
    drift_block_actions:
      - quarantine_shifted_batch
      - revalidate_baseline
      - segment_source_distribution
      - re_fetch_recent_data
  memory:
    record_quality_snapshot: true
    rule_id_prefix: statistical

semantic_quality:
  enabled: true
  auto_record_to_memory: true
  default_label_field: label
  default_window: latest
  ids:
    record_id_candidates:
      - record_id
      - id
      - row_id
      - sample_id
      - uuid
  scoring:
    pass_threshold: 0.90
    warn_threshold: 0.75
    weights:
      leakage: 0.45
      consistency: 0.30
      provenance: 0.25
  leakage_detection:
    exact_match_block_threshold: 0.20
    exact_match_warn_threshold: 0.05
    normalized_similarity_threshold: 0.97
    high_risk_confidence: 0.90
    suspicious_name_block_terms:
      - label
      - target
      - answer_key
      - ground_truth
      - expected_output
      - gold_label
    suspicious_name_warn_terms:
      - hint
      - class
      - predicted
      - resolved_label
    future_terms:
      - future
      - outcome
      - post_event
      - resolution
    suspicious_text_fields:
      - text
      - content
      - prompt
      - context
      - description
    fingerprint_fields_exclude:
      - id
      - record_id
      - uuid
      - start_time
      - end_time
      - created_at
      - updated_at
      - timestamp
      - source_id
      - batch_id
  cross_field_consistency:
    max_record_inconsistency_rate_warn: 0.05
    max_record_inconsistency_rate_block: 0.15
    duplicate_entity_fields:
      - entity_id
      - item_id
      - document_id
    label_conflict_block_threshold: 0.10
    rules:
      - rule_id: start_before_end
        type: temporal_order
        earlier_field: start_time
        later_field: end_time
        severity: high
        message: Start time must not occur after end time.
      - rule_id: created_before_updated
        type: temporal_order
        earlier_field: created_at
        later_field: updated_at
        severity: medium
        message: Created timestamp must not occur after updated timestamp.
      - rule_id: resolved_requires_resolution_time
        type: required_if
        if_field: status
        if_equals: resolved
        required_field: resolved_at
        severity: medium
        message: Resolved records must include resolved_at.
      - rule_id: source_matches_input_source
        type: equals_if_present
        field: source_id
        compare_to_value_ref: input.source_id
        severity: high
        message: Record source_id must match the evaluation source_id when present.
  provenance:
    min_trust_score: 0.65
    block_below_trust: 0.45
    block_on_missing_required: false
    required_fields:
      - source_id
      - source_type
      - collected_at
    optional_fields:
      - checksum
      - lineage_id
      - collector
      - uri
      - schema_version
    confidence_weights:
      memory_reliability: 0.45
      metadata_completeness: 0.25
      recency: 0.15
      checksum: 0.10
      lineage: 0.05
    freshness_windows_seconds:
      fresh: 86400
      acceptable: 604800
  remediation:
    leakage_block_actions:
      - quarantine_records
      - drop_leaking_features
      - re_fetch_labels
      - review_feature_selection
    leakage_warn_actions:
      - review_feature_selection
      - mask_leaking_tokens
      - run_manual_audit
    consistency_actions:
      - normalize_cross_fields
      - quarantine_conflicting_records
      - enforce_schema_rules
      - review_duplicate_entities
    provenance_actions:
      - manual_attestation
      - reduce_source_weight
      - re_fetch_provenance
      - verify_lineage
  memory:
    record_source_reliability: true
    record_quality_snapshot: true
    rule_id_prefix: semantic

workflow_control: {}

quality_memory:
  enabled: true
  backend: hybrid
  auto_persist: true
  bootstrap_on_start: true
  persist_every_n_writes: 1
  defaults:
    default_window: latest
    default_verdict: warn
    default_source_reliability: 0.5
  validation:
    score_bounds:
      min: 0.0
      max: 1.0
  persistence:
    storage_dir: quality/storage/quality_memory
    state_filename: quality_memory_state.json
    journal_filename: quality_memory_journal.jsonl
    fsync_on_write: false
  journaling:
    enabled: true
  retention:
    max_snapshots_per_source: 2000
    max_drift_baselines_per_metric: 250
    max_drift_observations_per_metric: 2000
    max_schema_versions_per_source: 200
    max_threshold_decisions_per_rule: 250
    max_remediation_outcomes_per_rule: 1000
    max_conflicts_per_scope: 500
    max_source_reliability_events: 1000
  conflict_resolution:
    default_strategy: weighted_consensus
    block_on_critical: true
    quarantine_on_high_disagreement: true
    checker_weight:
      default: 1.0
      structural: 1.0
      statistical: 1.15
      semantic: 1.2
      workflow: 1.1
    verdict_rank:
      pass: 0
      warn: 1
      block: 2
    severity_rank:
      low: 1
      medium: 2
      high: 3
      critical: 4

# -----------------------------------------------------------------------------
# Quality intelligence expansion
# -----------------------------------------------------------------------------
fitness_policy:
  enabled: true
  default_profile: general
  allow_runtime_overrides: false
  allow_runtime_relaxation: false
  allow_weight_overrides: false
  use_case_profiles:
    general: general
    knowledge_ingestion: knowledge_ingestion
    training: training
    replay: replay
    inference_context: inference_context
    memory_write: memory_write
  profiles:
    general:
      use_case: general
      pass_threshold: 0.90
      warn_threshold: 0.75
      subsystem_weights: {structural: 0.34, statistical: 0.33, semantic: 0.33}
      required_checks: [schema, provenance]
      hard_block_error_types: [privacy_policy_conflict]
      min_source_reliability: 0.50
      require_trusted_baseline: false
      baseline_bootstrap_allowed: true
      minimum_evidence_strength: moderate
    knowledge_ingestion:
      use_case: knowledge_ingestion
      pass_threshold: 0.91
      warn_threshold: 0.78
      subsystem_weights: {structural: 0.34, statistical: 0.26, semantic: 0.40}
      required_checks: [schema, provenance, consistency]
      hard_block_error_types: [provenance_untrusted, privacy_policy_conflict]
      min_source_reliability: 0.65
      require_trusted_baseline: false
      baseline_bootstrap_allowed: true
      minimum_evidence_strength: moderate
    training:
      use_case: training
      pass_threshold: 0.94
      warn_threshold: 0.82
      subsystem_weights: {structural: 0.30, statistical: 0.30, semantic: 0.40}
      required_checks: [schema, leakage, provenance, drift, relationship_drift]
      hard_block_error_types: [leakage_detected, provenance_untrusted, privacy_policy_conflict]
      min_source_reliability: 0.75
      require_trusted_baseline: true
      baseline_bootstrap_allowed: false
      minimum_evidence_strength: strong
    replay:
      use_case: replay
      pass_threshold: 0.92
      warn_threshold: 0.80
      subsystem_weights: {structural: 0.32, statistical: 0.34, semantic: 0.34}
      required_checks: [schema, duplicates, drift, provenance]
      hard_block_error_types: [leakage_detected, privacy_policy_conflict]
      min_source_reliability: 0.70
      require_trusted_baseline: true
      baseline_bootstrap_allowed: false
      minimum_evidence_strength: strong
    inference_context:
      use_case: inference_context
      pass_threshold: 0.92
      warn_threshold: 0.80
      subsystem_weights: {structural: 0.32, statistical: 0.25, semantic: 0.43}
      required_checks: [schema, provenance, consistency]
      hard_block_error_types: [provenance_untrusted, privacy_policy_conflict]
      min_source_reliability: 0.70
      require_trusted_baseline: false
      baseline_bootstrap_allowed: false
      minimum_evidence_strength: strong
    memory_write:
      use_case: memory_write
      pass_threshold: 0.93
      warn_threshold: 0.82
      subsystem_weights: {structural: 0.35, statistical: 0.25, semantic: 0.40}
      required_checks: [schema, provenance, consistency]
      hard_block_error_types: [provenance_untrusted, privacy_policy_conflict]
      min_source_reliability: 0.75
      require_trusted_baseline: false
      baseline_bootstrap_allowed: false
      minimum_evidence_strength: strong

baseline_governance:
  enabled: true
  metric_name: dataset_profile
  min_stable_batches: 3
  min_source_reliability: 0.70
  allowed_structural_verdicts: [pass]
  allowed_semantic_verdicts: [pass, warn]
  max_quality_score_delta: 0.08
  max_baseline_age_seconds: 2592000
  trust_explicit_baseline: false
  require_schema_match: true
  persist_trusted_baselines: true
  allow_export_state_fallback: true
  accept_legacy_baselines: false
  use_memory_snapshot_history: false
  history_limit: 12

relationship_quality:
  enabled: true
  profile_metric_name: relationship_profile
  max_numeric_fields: 30
  min_pair_observations: 20
  min_absolute_baseline_correlation: 0.20
  warn_correlation_delta: 0.20
  block_correlation_delta: 0.40
  warn_missingness_delta: 0.20
  block_missingness_delta: 0.40
  significance_alpha: 0.05
  require_statistical_support_for_block: true
  pass_threshold: 0.90
  warn_threshold: 0.75
  exclude_fields:
    - record_id
    - id
    - row_id
    - sample_id
    - uuid
    - created_at
    - updated_at
    - timestamp
    - batch_id
    - source_id
  remediation_actions:
    warn:
      - review_feature_relationships
      - compare_recent_batches
      - review_upstream_transformations
    block:
      - quarantine_relationship_shifted_batch
      - revalidate_upstream_transformations
      - rebuild_trusted_baseline
      - review_feature_engineering

evidence_calibration:
  enabled: true
  confidence_level: 0.95
  sample_support_scale: 50.0
  component_weights:
    sample_support: 0.30
    coverage: 0.20
    baseline_trust: 0.20
    source_reliability: 0.15
    detector_agreement: 0.15
  strength_thresholds:
    weak: 0.35
    moderate: 0.55
    strong: 0.75
    very_strong: 0.90
  baseline_trust_scores:
    unestablished: 0.00
    rejected: 0.00
    candidate: 0.35
    stale: 0.30
    superseded: 0.20
    trusted: 0.90
    active: 1.00
  batch_aggregation:
    mean_weight: 0.70
    minimum_weight: 0.30
