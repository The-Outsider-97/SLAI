embed_dim: 512
vocab_size: 50000
num_heads: 8
num_layers: 4
num_styles: 14
num_classes: 10
initializer: xavier_uniform # or he_normal
device: "cpu"
dropout_rate: 0.1
causal: False
training: True
ff_dim: 2048
positional_encoding: "sinusoidal"
max_position_embeddings: 5000
activation: gelu
norm_type: "layernorm"  # "layernorm", "batchnorm", or None or "instancenorm", or null
encoder_type: "transformer"  # or "mfcc"
in_channels: 3
dynamic_patching: true


parameter: {}

tensor_ops:
  eps: 0.00001
  momentum: 0.1
  affine: true
  training: True
  elementwise_affine: True
  track_running_stats: False
  mode: "bilinear"
  antialias: False
  scale_factor: 2.0
  p: 0.5
  inplace: False
  return_mask: False
  causal: False

attention:
  dim_head: 64
  q_bucket_size: 512
  k_bucket_size: 1024
  memory_efficient: False
  epsilon: 0.00001
  num_features: 64

feedforward:
  use_bias: true
  fusion_type: "add"        # "add", "concat", or "film"
  context_dim: 256          # only needed for concat/film

tokenizer:
  max_length: 512
  cls_token: "[CLS]"
  sep_token: "[SEP]"
  image_token : "[IMG]"
  audio_token : "[AUDIO]"

transformer:
  return_hidden: False

task_heads:
  layer_norm_eps: 0.00001

classification: {}

regression:
  use_skip: True
  output_dim: 1

seq2seq:
  decoder_layers: 1
  tie_weights: True

multimodal:
  fusion_method: "concat"
  use_attention: True

perception_memory:
  enable_checkpointing: True
  checkpoint_dir: "src/agents/perception/checkpoints/"
  cache_dir: "src/agents/perception/cache/"
  enable_cache: True
  max_cache_size: 100
  max_memory_mb: 512               # 0 disables the memory-budget eviction pass
  cache_ttl_seconds: 0              # 0 disables TTL-based expiry
  eviction_policy: "lru"            # "lru" or "size" (evict largest resident item first)
  enable_disk_persistence: False    # spill evicted items to cache_dir and reload on demand
  persist_index_filename: "memory_index.json"
  checkpoint_retention: 20          # 0 = keep every checkpoint file indefinitely
  validate_finite: True             # reject NaN/Inf tensors on cache/checkpoint
  key_algorithm: "sha256"           # any hashlib-supported algorithm
  lock_timeout_seconds: 5.0         # bounded wait on the internal RLock

audio_encoder:
  encoder_type: "transformer"
  audio_length: 16000
  patch_size: 400
  positional_encoding: "learned"
  in_channels: 1

vision_encoder:
  encoder_type: "transformer"
  img_size: 224
  patch_size: 16
  positional_encoding: learned
  output_activation: sigmoid
  in_channels: 3

mfcc:
  sample_rate: 16000
  n_mfcc: 13
  frame_length_ms: 25
  frame_step_ms: 10
  n_filters: 40
  low_freq: 0
  high_freq: 8000

cnn:
  # Audio CNN
  out_channels: [64, 128, 256]
  kernel_sizes: [3, 3, 3]
  strides: [2, 2, 2]

  # Vision CNN
  input_size: [224, 224]
  channels: 3
  filters:
    - [11, 11, 96]
    - [5, 5, 256]
    - [3, 3, 384]

  spp_levels: [1, 2, 4]

inference:
  vision_batch: 8
  audio_batch: 16
  text_batch: 32
  use_residual: true

text_encoder:
  max_gen_length: 64

audio_decoder:
  decoder_type: "transformer"   # transformer | cnn | mfcc
  in_channels: 1
  audio_length: 16000

cnn_decoder:
  base_channels: 256
  min_channels: 32
  upsample_factors: [4, 4, 4, 4]
  kernel_size: 5
  output_activation: "none"

mfcc_decoder:
  griffin_lim_iterations: 16
  phase_initialization: "zeros"
  log_epsilon: 0.000001
  pinv_rcond: 0.000001
  replicate_channels: false
  output_activation: "none"

generator: 
  temperature: 1.0
  top_k: 0
  top_p: 0.0
  repetition_penalty: 1.2
