animation:
  timeline:
    default_fps_num: 30
    default_fps_den: 1
  evaluation:
    deterministic: true
    max_batch_samples: 256
  limits:
    max_tracks: 4096
    max_keyframes: 100000
  motion:
    learned_generation_enabled: false
    blending_enabled: false
    retargeting_enabled: false
    choreography_enabled: false
  commands:
    require_expected_revision: false
    max_batch_operations: 128
  memory:
    max_recent_edits: 256
