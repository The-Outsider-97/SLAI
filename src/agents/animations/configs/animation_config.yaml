animation:
  timeline:
    default_fps_num: 30
    default_fps_den: 1
  evaluation:
    deterministic: true
  limits:
    max_tracks: 4096
    max_keyframes: 100000
  motion:
    learned_generation_enabled: false
    blending_enabled: false
    retargeting_enabled: false
    choreography_enabled: false
  # Applies to editing calls through animation_commands.update_animation.
  # false preserves the current facade API; true requires caller-supplied CAS.
  commands:
    require_expected_revision: false
  # Used when AnimationMemory(capacity=None) is constructed.
  memory:
    max_recent_edits: 256
