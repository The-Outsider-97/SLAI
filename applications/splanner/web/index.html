<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="splanner-token" content="__TOKEN__">
  <meta name="theme-color" content="#e6e9ef">
  <title>SPlanner · SLAI</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-mark">S<span class="mark-point"></span></span><span>SPlanner<small>INTELLIGENT WORKSPACE</small></span></div>
      <div class="workspace-tag"><span class="avatar">JR</span><span><strong>My workspace</strong><small>Personal · Local</small></span><span class="muted">⌄</span></div>
      <div class="nav-group-title">WORKSPACE</div>
      <nav id="nav" class="nav-list">
        <button type="button" class="nav-item active" data-view="today"><span aria-hidden="true">◈</span> Today</button>
        <button type="button" class="nav-item" data-view="calendar"><span aria-hidden="true">▦</span> Calendar</button>
        <button type="button" class="nav-item" data-view="tasks"><span aria-hidden="true">☑</span> My tasks</button>
        <button type="button" class="nav-item" data-view="notes"><span aria-hidden="true">▤</span> Notes</button>
        <button type="button" class="nav-item" data-view="board"><span aria-hidden="true">▧</span> Sticky board</button>
      </nav>
      <div class="side-calendar">
        <div class="side-calendar-head"><strong id="mini-month"></strong><div><button class="plain" data-nav="previous" aria-label="Previous week">‹</button><button class="plain" data-nav="next" aria-label="Next week">›</button></div></div>
        <div id="mini-calendar" class="mini-grid"></div>
      </div>
      <div class="side-bottom">
        <div class="storage-indicator"><span class="green-dot"></span><span>Stored on this device</span></div>
        <button type="button" id="theme" class="side-setting">☼ <span>Appearance</span><span class="muted">↻</span></button>
        <p class="scope">SPlanner v0.1 · Local-first foundation</p>
      </div>
    </aside>
    <main id="main" class="main">
      <header class="topbar">
        <div class="breadcrumbs"><span class="muted">Workspace</span><span class="crumb-sep">/</span><span id="crumb">Today</span></div>
        <div class="toolbar-actions">
          <span class="local-badge"><span class="green-dot"></span> Local mode</span>
          <button type="button" class="icon-button" id="notification-button" aria-label="View due reminders" title="Due reminders">♧<span id="notification-count" class="bubble" hidden></span></button>
          <button type="button" id="new" class="primary-button"><span aria-hidden="true">＋</span> Create new</button>
        </div>
      </header>
      <div class="content">
        <section class="page-heading">
          <div><span id="eyebrow" class="eyebrow">YOUR WORKSPACE</span><h1 id="title">Good to see you.</h1><p id="subtitle">Everything important, all in one calm place.</p></div>
          <div class="date-nav"><button class="plain icon-size" id="previous" aria-label="Previous week">‹</button><button type="button" id="today" class="today-button">Today</button><button class="plain icon-size" id="next" aria-label="Next week">›</button></div>
        </section>
        <div id="banner" class="notice" hidden role="status"></div>
        <div id="view" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="edit-form" method="dialog" novalidate>
      <div class="dialog-header"><div><div class="eyebrow">QUICK CREATE</div><h2 id="dialog-title">New event</h2></div><button type="button" id="dialog-close" class="plain close-button" aria-label="Close editor">×</button></div>
      <label class="field">Type<select id="edit-kind"><option value="events">Calendar event</option><option value="tasks">Task</option><option value="notes">Rich note (.sldc)</option><option value="reminders">Reminder</option><option value="stickies">Sticky note</option></select></label>
      <label class="field">Title<input id="edit-title" name="title" maxlength="180" required autocomplete="off" placeholder="What are you planning?"></label>
      <div id="edit-time-fields"><div class="field-row"><label class="field"><span id="edit-start-label">Starts</span><input id="edit-start" type="datetime-local"></label><label class="field" id="edit-end-field">Ends<input id="edit-end" type="datetime-local"></label></div></div>
      <div id="edit-task-fields" hidden><label class="field">Priority<select id="edit-priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label></div>
      <label class="field" id="edit-content-field" hidden>Content<textarea id="edit-content" rows="7" placeholder="Capture your thoughts..."></textarea></label>
      <label class="field" id="edit-color-field">Color<select id="edit-color"><option value="blue">Ocean blue</option><option value="violet">Violet</option><option value="green">Mint</option><option value="pink">Rose</option><option value="amber">Sunshine</option></select></label>
      <div class="dialog-actions"><button type="button" id="delete" class="secondary-button" hidden>Delete</button><span class="grow"></span><button type="button" id="cancel" class="secondary-button">Cancel</button><button type="submit" class="primary-button">Save</button></div>
    </form>
  </dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
