lantra_curriculum:
  # Output lives under train_lantra.py's default supervised discovery root.
  output_dir: data/processed/lantra/agent_enriched
  source_paths: []
  seed: 42
  validation_fraction: 0.10
  test_fraction: 0.10

  # Canonical source preparation. Document extraction/chunking is delegated to
  # train_lantra.py so this package does not duplicate PDF/DOCX/EPUB/HTML logic.
  min_document_chars: 180
  segment_min_chars: 160
  segment_chunk_chars: 1600
  max_documents: 0
  max_segments: 20000
  max_segments_per_document: 64

  # Agent participation.
  enable_knowledge: true
  enable_reasoning: true
  enable_perception: false
  perception_checkpoint_version: null
  require_perception_checkpoint: true

  # Phase 2B retrieval/hard-negative mining. KnowledgeAgent remains the owner of
  # retrieval scores; these thresholds are only curriculum acceptance policy.
  retrieval_top_k: 24
  max_retrieval_pairs: 2000
  min_positive_retrieval_score: 0.08
  min_negative_retrieval_score: 0.03
  min_retrieval_margin: 0.01
  min_perception_margin: 0.01

  # Phase 2A/2C bounded ontology/reasoning expansion.
  ontology_max_candidate_terms_per_segment: 32
  ontology_max_facts_per_segment: 8
  max_phase_2a_examples_per_document: 8
  max_phase_2c_examples_per_document: 12
  reasoning_threshold: 0.75

  # Hard quality invariants.
  require_heldout_coverage: true
  reuse_if_unchanged: true
  fail_on_agent_error: true
  max_record_chars: 20000
