name: SLAI v2.4 Knowledge Assurance A-E

on:
  pull_request:
    branches: [SLAI-v.2.4]
    paths:
      - 'src/agents/knowledge/**'
      - 'src/agents/knowledge_agent.py'
      - 'tests/knowledge_assurance/**'
      - 'tests/knowledge_assurance_integration/**'
      - 'tests/knowledge_assurance_phase_de/**'
      - '.github/workflows/knowledge-assurance-v24.yml'
  push:
    branches: [SLAI-v.2.4]
    paths:
      - 'src/agents/knowledge/**'
      - 'src/agents/knowledge_agent.py'
      - 'tests/knowledge_assurance/**'
      - 'tests/knowledge_assurance_integration/**'
      - 'tests/knowledge_assurance_phase_de/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    name: assurance-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    timeout-minutes: 15
    env:
      PYTHONPATH: src/agents/knowledge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate contract/package source compilation
        run: python -m compileall -q src/agents/knowledge/assurance
      - name: Run offline assurance tests (no external service needed)
        run: python -m unittest discover -s tests/knowledge_assurance -v
      - name: Enforce P0 repository integration gates
        run: python -m unittest discover -s tests/knowledge_assurance_integration -v
      - name: Run consolidated Phase D-E regression tests
        run: python -m unittest discover -s tests/knowledge_assurance_phase_de -v
