name: Spatial Format Regression

on:
  pull_request:
    branches: [SLAI-v.2.4]
    paths: ['src/utils/spatial_formats/**', 'src/agents/animations/**', 'src/agents/animation_agent.py', 'tests/spatial_formats/**', 'tests/agents/animations/**', '.github/workflows/spatial-formats.yml']
  push:
    branches: [SLAI-v.2.4]
    paths: ['src/utils/spatial_formats/**', 'tests/spatial_formats/**', '.github/workflows/spatial-formats.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-formats:
    name: spatial ${{ matrix.os }} py${{ matrix.python }} ${{ matrix.backends }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
        backends: [core, exchange]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install pytest pytest-cov jsonschema numpy scipy pyyaml requests psutil pydantic packaging cryptography tenacity regex portalocker
      - name: Install optional exchange backends
        if: matrix.backends == 'exchange'
        run: python -m pip install numpy ezdxf trimesh
      - name: Compile spatial core
        run: python -m compileall -q src/utils/spatial_formats src/agents/animations src/agents/animation_agent.py
      - name: Test spatial formats and coverage
        run: python -m pytest tests/spatial_formats/ tests/agents/animations/ -W error -v --tb=long --cov=src.utils.spatial_formats --cov-report=term-missing --junitxml=spatial-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-results-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.backends }}
          path: spatial-results.xml
          if-no-files-found: ignore
