name: CI

on:
  pull_request:
    branches:
      - SLAI-v.2.3

  push:
    branches:
      - SLAI-v.2.3

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  foundation:
    name: Foundation CI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d

        with:
          version: "0.11.33"
          python-version: "3.10"
          enable-cache: true

      - name: Provision pinned LSTP
        run: python setup_lstp.py --no-install

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev --all-extras

      - name: Verify Python sources compile
        run: |
          uv run python -m compileall -q src
          uv run python -m compileall -q deployment
          uv run python -m py_compile slailm.py
          uv run python -m py_compile setup_lstp.py

      - name: Verify release invariant tests
        run: |
          uv run python -m pytest -q deployment/test

      - name: Verify complete test suite
        run: |
          uv run python -m pytest -q

      - name: Check dependency lock again
        run: uv lock --check
