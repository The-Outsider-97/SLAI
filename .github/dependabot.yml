version: 2

updates:
  - package-ecosystem: uv
    directory: /
    target-branch: SLAI-v.2.2
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: SLAI-v.2.2
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
